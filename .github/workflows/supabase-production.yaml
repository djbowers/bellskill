name: Deploy Migrations to Production

on:
  push:
    branches:
      - main
    paths:
      - supabase/**
  workflow_dispatch:

# Production is forward-only (`db push`, never reset). Serialise so two merges in
# quick succession can't apply migrations concurrently, and never cancel: an
# interrupted push can leave a migration half-applied.
concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      - run: supabase db push
      - name: Deploy edge functions
        run: |
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID"
          done
