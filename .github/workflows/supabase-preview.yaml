name: Deploy PR Backend to Staging

# Deploys a PR's Supabase migrations + functions to the Bellskill Dev (staging)
# project so the matching Netlify deploy preview (which points at staging via
# netlify.toml) exercises the PR's real backend changes.
#
# NOTE: staging is a single shared project, so concurrent PRs that both touch
# supabase/** can stomp on each other, and migrations are forward-only. This is
# an accepted trade-off for a low-concurrency workflow; re-baseline staging from
# main periodically (the sync-develop -> supabase-staging path already does this
# after each merge).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - supabase/**
  workflow_dispatch:

# Cancel an in-flight run when the PR is updated again.
concurrency:
  group: supabase-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID

      # Staging is a single shared project (see header note), so a concurrent PR
      # that also touches supabase/** leaves its migration versions in staging's
      # history that this branch doesn't have. `supabase db push` then aborts
      # with "Remote migration versions not found in local migrations directory"
      # before applying anything -- and no timestamp on THIS branch's own
      # migration can clear a remote-only version. Reconcile that drift by
      # marking each remote-only version reverted (the CLI's own suggested
      # remedy) and retrying. A run with no drift pushes on the first attempt and
      # never repairs anything.
      - name: Push migrations to staging (reconciling shared-project drift)
        run: |
          for attempt in 1 2 3 4 5; do
            if output=$(supabase db push 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if ! echo "$output" | grep -q "Remote migration versions not found"; then
              echo "::error::db push failed for a reason other than shared-staging migration drift"
              exit 1
            fi
            versions=$(echo "$output" \
              | sed -nE 's/.*migration repair --status reverted (.*)$/\1/p' \
              | tr -s ' ' '\n' \
              | grep -E '^[0-9]+$')
            if [ -z "$versions" ]; then
              echo "::error::could not parse remote-only migration versions to reconcile"
              exit 1
            fi
            for v in $versions; do
              echo "Reconciling shared-staging drift: marking remote-only migration $v as reverted"
              supabase migration repair --status reverted "$v"
            done
          done
          echo "::error::still failing after reconciling migration drift"
          exit 1

      - run: supabase functions deploy create-checkout-session --project-ref $SUPABASE_PROJECT_ID
      - run: supabase functions deploy stripe-webhook --project-ref $SUPABASE_PROJECT_ID
      - run: supabase functions deploy create-portal-session --project-ref $SUPABASE_PROJECT_ID
      - run: supabase functions deploy recommend-session --project-ref $SUPABASE_PROJECT_ID
      - run: supabase functions deploy set-subscription --project-ref $SUPABASE_PROJECT_ID
